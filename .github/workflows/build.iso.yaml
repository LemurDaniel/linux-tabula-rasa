# ---------------------------------------------------------------------------
# Build ISO
#   Tests both modules, builds the live ISO and publishes it as an artifact.
#   A tag v* also creates a GitHub release with the ISO and SHA256SUMS,
#   which Write-TabulaRasaStick.ps1 -FromRelease / --from-release downloads.
#
#   Triggers:
#     workflow_dispatch   Manual build from the Actions tab (artifact only).
#     push of a tag v*    Release build, e.g. 'git tag v0.1.0 && git push --tags'.
#                         A tag with a suffix (v0.1.0-rc.1) becomes a pre-release for testing.
#
#   No extra secrets: the release job uses the GITHUB_TOKEN with contents: write.
# ---------------------------------------------------------------------------

#
#   Chapters:
#     BUILD AND RELEASE THE ISO   Pester and PSScriptAnalyzer, live-build, the release on tags.
#

name: Build ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:

  # ===========================================================================
  # ======================   BUILD AND RELEASE THE ISO   ======================
  # ===========================================================================
  #
  #   1. Test      Runs PSScriptAnalyzer and the Pester tests of both modules.
  #   2. Build     Builds the ISO with live-build in docker, only after the tests passed.
  #   3. Release   On a v* tag: publishes the ISO and its checksum as GitHub release.
  #

  # ---------------------------------------------------------------------------
  # Test
  #   Runs PSScriptAnalyzer and the Pester tests of both modules.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analyze and test
        shell: pwsh
        run: |
          Set-StrictMode -Version 1.0
          $ErrorActionPreference = 'Stop'

          Install-PSResource -Name PSScriptAnalyzer, Pester -TrustRepository

          $Findings = @('./src', './build') | ForEach-Object {
              Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Warning, Error
          }
          if ($Findings.Count -GT 0) {
              $Findings | Format-Table -AutoSize | Out-String | Write-Host
              throw [System.InvalidOperationException]::new("PSScriptAnalyzer must report no findings, got $($Findings.Count).")
          }

          $PesterConfig = New-PesterConfiguration
          $PesterConfig.Run.Path = './src'
          $PesterConfig.Run.Exit = $true
          Invoke-Pester -Configuration $PesterConfig

  # ---------------------------------------------------------------------------
  # Build
  #   Builds the ISO with live-build in docker, only after the tests passed.
  # ---------------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ISO
        shell: pwsh
        run: ./build/Build-TabulaRasaIso.ps1 -Verbose

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tabula-rasa-iso
          path: out/*.iso
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release
  #   On a v* tag: publishes the ISO and its checksum as GitHub release.
  # ---------------------------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-tabula-rasa-iso
          path: out

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          Set-StrictMode -Version 1.0
          $ErrorActionPreference = 'Stop'

          # 'linux-tabula-rasa-amd64.hybrid.iso' => 'linux-tabula-rasa-v0.1.0-amd64.iso'
          $Iso     = Get-ChildItem -Path ./out -Filter '*.iso' | Select-Object -First 1
          $IsoName = "linux-tabula-rasa-$($env:TAG)-amd64.iso"
          Move-Item -Path $Iso.FullName -Destination "./out/$IsoName"

          # SHA256SUMS in the format of sha256sum: '<hash>  <file>'.
          $Hash = (Get-FileHash -Path "./out/$IsoName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $IsoName" | Set-Content -Path ./out/SHA256SUMS -Encoding utf8NoBOM

          # A tag with a suffix (v0.1.0-rc.1) is a test build: pre-release, never shown as "latest".
          $ReleaseArgs = @($env:TAG, "./out/$IsoName", './out/SHA256SUMS', '--title', "Linux Tabula Rasa $($env:TAG)", '--generate-notes')
          if ($env:TAG.Contains('-')) {
              $ReleaseArgs += '--prerelease'
          }
          gh release create @ReleaseArgs
          if ($LASTEXITCODE -NE 0) {
              throw [System.InvalidOperationException]::new("gh release create must succeed, got exit code $LASTEXITCODE.")
          }
